site_name: Rosaninha — Documentação
site_url: https://alissonluana.github.io/rosaninha/
repo_url: https://github.com/AlissonLuana/rosaninha
docs_dir: docs

nav:
  - Início: index.md
  - Marca: 01-marca.md
  - Ebook: 02-ebook.md
  - Canal de conteúdo: 03-canal-de-conteudo.md
  - Burocráticos: 04-burocraticos.md

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    scheme: default

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
